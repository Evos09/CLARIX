<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" width="24" height="24" alt="" />
      <span>CLARIX</span>
    </header>

    <main id="app">
      <!-- Signed out -->
      <section id="view-signed-out" hidden>
        <p class="muted">Connect your CLARIX account to record meetings.</p>
        <button id="btn-connect" class="primary">Connect account</button>
      </section>

      <!-- Signed in -->
      <section id="view-ready" hidden>
        <p class="who"><span id="email"></span><span id="plan" class="badge"></span></p>
        <button id="btn-record" class="primary">Record this tab</button>
        <button id="btn-stop" class="danger" hidden>Stop &amp; save</button>
        <button id="btn-ask" class="link">🔍 Ask your meetings</button>
        <p id="status" class="muted"></p>
        <a id="open-meeting" href="#" target="_blank" hidden>Open meeting →</a>
        <button id="btn-signout" class="link">Sign out</button>
      </section>

      <section id="view-loading">
        <p class="muted">Loading…</p>
      </section>
    </main>
  </body>
  <script src="popup.js"></script>
</html>
