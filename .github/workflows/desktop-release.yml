# Builds the CLARIX desktop app for Windows AND macOS and publishes a draft
# GitHub Release with the installers. This is the ONLY way to produce the macOS
# build without a Mac (it runs on a macOS runner).
#
# Trigger: push a tag like `desktop-v1.0.1` (or run manually).
# No signing keys required — the app currently ships unsigned. tauri-action
# creates a draft GitHub Release and uploads the .msi/.exe (Windows) and .dmg
# (macOS). Download the macOS .dmg from that release to host it on the site
# (drop it in /public/downloads and set MAC_DOWNLOAD_URL in lib/downloads.ts).

name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install desktop deps
        working-directory: clarix-desktop
        run: npm install

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: clarix-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "CLARIX Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
