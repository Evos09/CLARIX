# Builds the CLARIX desktop app for Windows AND macOS and publishes a draft
# GitHub Release with the installers. This is the ONLY way to produce the macOS
# build without a Mac (it runs on a macOS runner).
#
# Trigger: push a tag like `desktop-v1.0.4` (or run manually).
#
# tauri-action creates a DRAFT GitHub Release and uploads the .msi/.exe
# (Windows), the .dmg (macOS), and the signed updater artifacts + latest.json.
# Download the macOS .dmg from that release to host it on the site (drop it in
# /public/downloads and set MAC_DOWNLOAD_URL in lib/downloads.ts).
#
# IMPORTANT: installed apps update from `releases/latest/download/latest.json`,
# which only resolves once the release is PUBLISHED. Leaving it a draft means
# nobody gets the update. Publishing the release is what ships it.
#
# The app is still unsigned for the OS (no Apple/Authenticode cert) — that only
# affects the first-run install warning. TAURI_SIGNING_PRIVATE_KEY is a separate
# minisign key that authenticates updates; without it the updater is inert.

name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install desktop deps
        working-directory: clarix-desktop
        run: npm install

      # Without the signing key tauri-action still builds, but emits no
      # signatures and no usable latest.json — every installed copy would go on
      # silently believing it is up to date. Fail here instead.
      - name: Require the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY repository secret is not set — add it under Settings > Secrets and variables > Actions. Without it the release ships without update signatures and no installed app can update."
            exit 1
          fi

      # OS code-signing is optional and OFF until the certs exist. Unsigned
      # builds still work — they just trip SmartScreen / Gatekeeper on first
      # run. This step never fails the build; it only makes the state visible,
      # so nobody ships thinking it was signed when it wasn't.
      - name: Report OS code-signing status
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            if [ -n "${WINDOWS_CERTIFICATE:-}" ]; then
              echo "Windows: Authenticode certificate present — installer will be signed."
            else
              echo "::warning::Windows: no WINDOWS_CERTIFICATE secret — shipping UNSIGNED. Users will see the SmartScreen warning."
            fi
          else
            if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_ID:-}" ]; then
              echo "macOS: Developer ID certificate and Apple ID present — app will be signed and notarized."
            else
              echo "::warning::macOS: no APPLE_CERTIFICATE / APPLE_ID secrets — shipping UNSIGNED. Users must right-click > Open to get past Gatekeeper."
            fi
          fi

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # --- OS code-signing (all optional; unset = unsigned build) ---
          # Windows Authenticode: base64 of a .pfx, plus its password.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # macOS Developer ID: base64 of a .p12, its password, and the identity
          # name. APPLE_ID + APPLE_PASSWORD (an app-specific password) and
          # APPLE_TEAM_ID additionally trigger notarization, which is what
          # actually silences Gatekeeper — signing alone is not enough.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The key was generated with no password, and GitHub refuses to store
          # an empty secret. Set it explicitly rather than leaving it unset —
          # an undefined password can drop the signer into an interactive
          # prompt, which hangs the job until it times out.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: clarix-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "CLARIX Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
